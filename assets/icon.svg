<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Finline: an orca's dorsal fin drawn as git graph lanes converging at the tip. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2236" />
      <stop offset="1" stop-color="#0d111c" />
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)" />
  <g fill="none" stroke-width="12" stroke-linecap="round">
    <!-- leading edge: convex, sweeping back -->
    <path d="M 52 194 C 66 118 128 58 196 44" stroke="#3b82f6" />
    <!-- middle lane -->
    <path d="M 124 194 C 126 140 148 80 196 44" stroke="#10b981" />
    <!-- trailing edge: concave -->
    <path d="M 204 194 C 170 172 160 108 196 44" stroke="#ec4899" />
  </g>
  <!-- waterline, as thick as the lanes and drawn over their ends: the fin rises out of the water -->
  <g fill="none" stroke-linecap="round">
    <path d="M 44 200 Q 72 189 100 200 T 156 200 T 212 200" stroke="#0f1420" stroke-width="22" />
    <path d="M 44 200 Q 72 189 100 200 T 156 200 T 212 200" stroke="#334155" stroke-width="12" />
  </g>
  <g stroke="#0d111c" stroke-width="5">
    <circle cx="102" cy="99" r="10" fill="#3b82f6" />
    <circle cx="137" cy="130" r="10" fill="#10b981" />
    <circle cx="176" cy="148" r="10" fill="#ec4899" />
    <circle cx="196" cy="44" r="15" fill="#f8fafc" />
  </g>
</svg>
